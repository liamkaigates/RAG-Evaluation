name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy
      - name: Tests
        run: RAG_EMBEDDING_PROVIDER=local RAG_GENERATION_PROVIDER=local PYTHONPATH=src python -m unittest discover -s tests -v
